version: "3.9"
services:
  thyme:
    build:
      context: .
    command: ["uvicorn", "--factory", "thyme.app:create_app", "--host", "0.0.0.0", "--reload"]
    ports:
      - 8000:8000
    environment:
      # Traggo admin-user device-key
      TRAGGO_API_KEY: API_TOKEN_HERE
      # Redmine admin-user API key
      REDMINE_API_KEY: API_TOKEN_HERE
    volumes:
      - ./:/app/
