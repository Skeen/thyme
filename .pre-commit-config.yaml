repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.3.1
    hooks:
      - id: pyupgrade
        args: [ "--py310-plus" ]

  - repo: https://github.com/psf/black
    rev: 23.1.0
    hooks:
      - id: black
        args:
          # Preview is needed to get automatic string-breaking
          - '--preview'

  - repo: https://github.com/asottile/reorder_python_imports
    rev: v3.9.0
    hooks:
      - id: reorder-python-imports
#
#  - repo: https://github.com/PyCQA/pylint
#    rev: v2.16.2
#    hooks:
#      - id: pylint
#        additional_dependencies:
#          # - "pylint-pytest"
#          - "pylint-pydantic"
#        args:
#          # Load our plugins
#          # - '--load-plugins=pylint_pytest'
#          - '--load-plugins=pylint_pydantic'
#          # Ignore 'import-error' and 'no-name-in-module'
#          # As we do not want to install all dependencies under pre-commit
#          - '--disable=import-error'
#          - '--disable=no-name-in-module'
#          # Ignore redundant keyword arg, as we like keyword args
#          - '--disable=redundant-keyword-arg'
#          # Ignore 'wrong-import-order'
#          # reorder-python-imports decides the order, if pylint disagrees ¯\_(ツ)_/¯
#          - '--disable=C0411'
#          # Ignore import related issues in general
#          - '--ignore-imports=y'
#          # Ignore 'fixme'
#          # We allow TODOs in the source code
#          - '--disable=W0511'
#          # With 5 or more lines of duplicate code, we should refactor it
#          - '--min-similarity-lines=5'

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        entry: pflake8
        additional_dependencies:
          - pyproject-flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.0.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - sqlalchemy-stubs
          - types-requests
          - types-pytz

  - repo: https://github.com/fsfe/reuse-tool
    rev: v1.1.2
    hooks:
      - id: reuse

  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v4.4.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [ "--convention=google", "--add-ignore=D1" ]
        additional_dependencies:
          - tomli

  - repo: https://github.com/terrencepreilly/darglint
    rev: v1.8.1
    hooks:
      - id: darglint

  - repo: https://github.com/dosisod/refurb
    rev: v1.12.0
    hooks:
      - id: refurb
        additional_dependencies:
          - pydantic
          - sqlalchemy-stubs
