[tool.poetry]
name = "thyme"
version = "0.0.0"  # versioning handled by conventional commits
description = "Traggo to Redmine integration"
authors = ["Magenta <info@magenta.dk>"]
license = "MPL-2.0"
readme = "README.md"
homepage = "https://magenta.dk/"
repository = "https://git.magenta.dk/internal/thyme"
keywords = ["redmine", "traggo"]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^1.10.4"
python-redmine = "^2.3.0"
typer = "^0.3.2"
gql = {extras = ["requests"], version = "^3.2.0"}
more-itertools = "^8.8.0"
pytz = "^2021.1"
SQLAlchemy = "^1.4.36"
uvicorn = "^0.17.6"
fastapi = "^0.78.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.1"
pytest-split = "^0.8.0"
pytest-cov = "^4.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode="auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = "True"
warn_unused_configs = "True"
check_untyped_defs = "True"
disallow_untyped_defs = "True"
plugins = "pydantic.mypy,sqlmypy"

[tool.flake8]
max-line-length = 88
exclude = [
    ".git", "__pycache__", ".mypy_cache", ".pytest_cache", ".venv", ".gitlab"
]
