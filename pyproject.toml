[tool.poetry]
name = "thyme"
version = "0.0.0"  # versioning handled by conventional commits
description = "Traggo to Redmine integration"
authors = ["Magenta <info@magenta.dk>"]
license = "MPL-2.0"
readme = "README.md"
homepage = "https://magenta.dk/"
repository = "https://git.magenta.dk/internal/thyme"
keywords = ["redmine", "traggo"]

[tool.poetry.scripts]
thyme = "thyme.app:run"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.4.2"
python-redmine = "^2.4.0"
gql = {extras = ["requests"], version = "^3.2.0"}
more-itertools = "^10.1.0"
pytz = "^2021.1"
SQLAlchemy = "^1.4.36"
pydantic-settings = {extras = ["dotenv"], version = "^2.12.0"}

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode="auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = "True"
warn_unused_configs = "True"
check_untyped_defs = "True"
disallow_untyped_defs = "True"
plugins = ["pydantic.mypy", "sqlmypy"]

[tool.flake8]
max-line-length = 88
exclude = [
    ".git", "__pycache__", ".mypy_cache", ".pytest_cache", ".venv", ".gitlab"
]
